name: 构建并发布版本

on:
  push:
    branches: [main]
    paths: [RELEASE_NOTES.md]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: 安装构建依赖
        run: python -m pip install . build
      - name: 检查 Chrome
        shell: pwsh
        run: |
          $chromePaths = @("$env:ProgramFiles\Google\Chrome\Application\chrome.exe", "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe")
          if (-not ($chromePaths | Where-Object { Test-Path -LiteralPath $_ })) {
            python -m playwright install chrome
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: 离线测试
        run: python -m unittest test_workbench test_lifecycle -v
      - name: 构建安装包
        run: python -m build
      - name: 验证独立安装
        shell: pwsh
        run: |
          python -m venv "$env:RUNNER_TEMP\release-wheel-check"
          $py = "$env:RUNNER_TEMP\release-wheel-check\Scripts\python.exe"
          $wheel = (Get-ChildItem -LiteralPath dist -Filter '*.whl' | Select-Object -First 1).FullName
          & $py -m pip install $wheel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $py -I -m hunyuan_workbench --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $py smoke_mcp.py --installed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 打包源码并发布到 GitHub Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid release version' }
          $tag = "v$version"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists; existing files will not be overwritten" }
          git archive --format=zip "--prefix=hunyuan3d-workbench-$version/" "--output=dist/hunyuan3d-workbench-$version-source.zip" HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $files = @(Get-ChildItem -LiteralPath dist -File | Where-Object { $_.Name -match '\.(whl|gz|zip)$' })
          if ($files.Count -ne 3) { throw 'Expected exactly three release packages' }
          $hashes = $files | Sort-Object Name | ForEach-Object { (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLower() + '  ' + $_.Name }
          [IO.File]::WriteAllLines((Join-Path (Get-Location).Path 'dist\SHA256SUMS.txt'), $hashes, [Text.UTF8Encoding]::new($false))
          $assets = @($files | ForEach-Object FullName) + @((Resolve-Path dist/SHA256SUMS.txt).Path)
          gh release create $tag @assets --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "$tag · 混元 3D 网页工作台 CLI / MCP" --notes-file RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
